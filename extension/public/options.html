<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>SteadyUI Companion</title></head>
  <body>
    <h1>SteadyUI local companion</h1>
    <p>Enter the address and token of the Python companion running on this computer.</p>
    <label>Companion URL <input id="url" type="url" value="http://127.0.0.1:8765" /></label>
    <label>Companion token <input id="token" type="password" autocomplete="off" /></label>
    <button id="save" type="button">Save configuration</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
